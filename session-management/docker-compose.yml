services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app1:
    build: .
    ports:
      - "5001:5000"
    environment:
      - REDIS_URL=redis://redis:6379
      - APP_NAME=App-1
    depends_on:
      - redis

  app2:
    build: .
    ports:
      - "5002:5000"
    environment:
      - REDIS_URL=redis://redis:6379
      - APP_NAME=App-2
    depends_on:
      - redis

volumes:
  redis_data:
